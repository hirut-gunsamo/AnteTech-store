<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Every icon has its own file name under /brand. Browsers and installed
         apps keep the picture they saw at a URL, so new artwork gets a new
         file name rather than the same name with new contents. -->
    <link rel="icon" href="/brand/at-blue-favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/at-blue-favicon-32.png" />
    <!-- viewport-fit=cover lets the installed app run edge to edge; the
         layout keeps clear of the notch with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Installed app -->
    <link rel="manifest" href="/manifest.webmanifest?v=8" />
    <link rel="apple-touch-icon" href="/brand/at-blue-apple-touch-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AnteTech" />
    <!-- "default" keeps the app below the status bar. "black-translucent"
         draws underneath it, which hid the header behind the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="theme-color"
      content="#2563eb"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>AnteTech</title>

    <!--
      Stamps the saved theme before the first paint. Without this the page
      renders light, then flips once React mounts. Must stay in step with
      src/lib/theme.ts, which owns the same key and values.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('antetech.theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved
          }

          // Same idea for language: set it before paint so the document is
          // never briefly labelled as the wrong one.
          var lang = localStorage.getItem('antetech.lang')
          if (lang === 'en' || lang === 'am') {
            document.documentElement.lang = lang
          }
        } catch (error) {
          /* Private windows and blocked site data both throw; system theme wins. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
